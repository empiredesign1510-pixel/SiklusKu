         // Komponen auth harus didefinisikan di luar App.
        // Jika didefinisikan di dalam App, React membuat tipe komponen baru pada setiap
        // keystroke, lalu me-remount subtree dan input kehilangan fokus.
        const ShellCard = ({ children, wide = false }) => (
            <div className="auth-shell bg-gradient-to-br from-pink-100 via-purple-50 to-pink-200 dark:from-slate-900 dark:via-slate-800 dark:to-slate-900 flex justify-center p-4 font-sans text-slate-800 dark:text-slate-100">
                <div className={`auth-card bg-white/85 dark:bg-slate-800/85 backdrop-blur-xl p-7 md:p-10 rounded-[2.5rem] shadow-2xl ${wide ? 'max-w-2xl' : 'max-w-md'} w-full border border-white/60 dark:border-slate-700`}>

        const BrandHeader = ({ title, subtitle }) => (

                {message && <div className="mb-5 p-4 rounded-2xl bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-900/30 text-green-700 dark:text-green-300 text-sm font-medium">{message}</div>}

        // ==========================================
        // 2. APLIKASI UTAMA (REACT COMPONENT)
        // ==========================================
        const App = () => {
            // ---------- AUTH / CLOUD STATE ----------
            const [session, setSession] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [profileLoading, setProfileLoading] = useState(false);
            const [profileReady, setProfileReady] = useState(false);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [authMode, setAuthMode] = useState('login');

            const [authPassword, setAuthPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMessage, setAuthMessage] = useState('');
            const [authBusy, setAuthBusy] = useState(false);
            const [syncState, setSyncState] = useState('idle');

            // ---------- USER / APP STATE ----------
            // localStorage hanya dipakai sebagai fallback migrasi data V1 dan preferensi tema.
            const [userName, setUserName] = useState('');
            const [userAge, setUserAge] = useState('');

            const [lastPeriodDate, setLastPeriodDate] = useState(() => {
                const legacy = localStorage.getItem('siklusku_lastPeriod');
                if (legacy) return legacy;
                const d = new Date();
                d.setDate(d.getDate() - 2);
                return getLocalDateString(d);
            });
            const [cycleLength, setCycleLength] = useState(() => parseInt(localStorage.getItem('siklusku_cycle')) || 28);
            const [periodLength, setPeriodLength] = useState(() => parseInt(localStorage.getItem('siklusku_period')) || 5);

            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('siklusku_theme') === 'dark');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('beranda');

            const [waterGlasses, setWaterGlasses] = useState(0);
            const [currentMood, setCurrentMood] = useState(null);

            const [cheeringMessage, setCheeringMessage] = useState("");
            const [messageKey, setMessageKey] = useState(0);

            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
            const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
            const [selectedArticle, setSelectedArticle] = useState(null);

            // ---------- SIKLUSKU 2.0: HEALTH TRACKING ----------
            const [dailySymptoms, setDailySymptoms] = useState([]);
            const [painLevel, setPainLevel] = useState(0);
            const [dailyNotes, setDailyNotes] = useState('');
            const [dailyLogMessage, setDailyLogMessage] = useState('');
            const [periodLogs, setPeriodLogs] = useState([]);
            const [periodStartInput, setPeriodStartInput] = useState(getLocalDateString());
            const [periodLogBusy, setPeriodLogBusy] = useState(false);

            const [reminderEnabled, setReminderEnabled] = useState(false);
            const [reminderDaysBefore, setReminderDaysBefore] = useState(2);
            const [reminderTime, setReminderTime] = useState('08:00');
            const [notificationPermission, setNotificationPermission] = useState(() => (
                typeof Notification === 'undefined' ? 'unsupported' : Notification.permission
            ));
            const [reminderMessage, setReminderMessage] = useState('');

            const [tempName, setTempName] = useState(() => localStorage.getItem('siklusku_name') || '');
            const [tempAge, setTempAge] = useState(() => localStorage.getItem('siklusku_age') || '');

            const currentUserId = session?.uid || null;
            const todayString = getLocalDateString();

            const friendlyAuthError = (error = {}) => {
                const code = error?.code || '';
                const message = error?.message || '';
                const map = {
                    'auth/invalid-credential': 'Email atau password salah.',
                    'auth/wrong-password': 'Email atau password salah.',
                    'auth/user-not-found': 'Email atau password salah.',
                    'auth/email-already-in-use': 'Email ini sudah terdaftar. Silakan masuk.',
                    'auth/invalid-email': 'Format email tidak valid.',
                    'auth/weak-password': 'Password terlalu lemah. Gunakan minimal 6 karakter.',
                    'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu beberapa saat lalu coba lagi.',
                    'auth/network-request-failed': 'Koneksi ke Firebase gagal. Periksa internet lalu coba lagi.',
                    'auth/operation-not-allowed': 'Login Email/Password belum diaktifkan di Firebase Authentication.',
                    'auth/unauthorized-domain': 'Domain website belum diizinkan di Firebase Authentication.'
                };
                return map[code] || message || 'Terjadi kesalahan. Coba lagi.';
            };

            // Firebase Auth memulihkan user yang tersimpan dan memanggil observer saat status login berubah.
            useEffect(() => {
                if (!firebaseAuth) {
                    setAuthLoading(false);
                    return;
                }

                const unsubscribe = firebaseAuth.onAuthStateChanged((user) => {
                    setSession(user || null);

                        setWaterGlasses(0);

                }, (error) => {

                return () => unsubscribe();

            // Firestore structure:
            // users/{uid} -> profil + pengaturan siklus

                            userRef.get(),

                            periodQuery.get()
                        ]);
                        if (cancelled) return;

                        const profile = userSnap.exists ? userSnap.data() : null;
                        const daily = dailySnap.exists ? dailySnap.data() : null;

                        if (profile?.onboardingCompleted) {
                            setUserName(profile.displayName || 'Pengguna');

                            if (profile.lastPeriodDate) setLastPeriodDate(profile.lastPeriodDate);
                            if (profile.cycleLength) setCycleLength(profile.cycleLength);
                            if (profile.periodLength) setPeriodLength(profile.periodLength);

                        setWaterGlasses(daily?.waterGlasses ?? 0);

                        setSyncState('synced');

                        if (!cancelled) {
                            console.error('Gagal memuat data user dari Firestore:', error);

                                setAuthError('Akses Firestore ditolak. Publish file firestore.rules yang saya sertakan.');
                            } else {

            const getPhaseForDate = (checkDate, baseDate, cycleL, periodL) => {
                const cDate = new Date(checkDate); cDate.setHours(0,0,0,0);
                const bDate = new Date(baseDate); bDate.setHours(0,0,0,0);
                const diffTime = cDate - bDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let dayOfCycle;
                if (diffDays >= 0) { dayOfCycle = (diffDays % cycleL) + 1; } 
                else { dayOfCycle = cycleL - (Math.abs(diffDays + 1) % cycleL); if (dayOfCycle === 0) dayOfCycle = cycleL; }

                const currentDayOfCycle = diffDays >= 0 ? (diffDays % cycleLength) + 1 : cycleLength - (Math.abs(diffDays + 1) % cycleLength);

            const articles = [
                { id: 1, category: "Kesehatan", icon: AlertCircle, time: "3 min baca", title: "Mengapa Perut Terasa Kram Saat Hari Pertama Haid?", desc: "Penjelasan medis mengenai kontraksi rahim dan cara alami meredakannya tanpa obat keras.", content: ["Kram perut atau dismenore pada hari pertama menstruasi adalah hal yang sangat umum dialami oleh banyak wanita. Rasa sakit ini disebabkan oleh hormon bernama prostaglandin yang memicu otot rahim berkontraksi untuk meluruhkan lapisannya.", "Semakin tinggi kadar prostaglandin, semakin kuat kontraksi yang terjadi. Kontraksi yang terlalu kuat ini bisa menekan pembuluh darah di sekitarnya, memutus suplai oksigen ke jaringan rahim sesaat, yang akhirnya mengirimkan sinyal rasa sakit ke otak.", "Untuk meredakannya secara alami, kamu bisa mencoba mengompres perut dengan botol air hangat. Panas membantu melemaskan otot rahim yang tegang. Selain itu, meminum teh jahe atau teh chamomile hangat terbukti secara klinis dapat menurunkan kadar prostaglandin dan memberikan efek rileks pada tubuh."] },
                { id: 2, category: "Nutrisi", icon: Apple, time: "5 min baca", title: "7 Makanan Ajaib Penyelamat Mood Swing PMS", desc: "Dari cokelat hitam hingga pisang, temukan makanan yang terbukti memperbaiki mood saat PMS.", content: ["Pre-Menstrual Syndrome (PMS) seringkali membawa gelombang emosi yang naik turun alias mood swing. Hal ini disebabkan oleh fluktuasi hormon estrogen dan progesteron yang mempengaruhi zat kimia otak seperti serotonin (hormon kebahagiaan).", "Kabar baiknya, asupan makanan yang tepat bisa menjadi penyelamat! Pertama, Cokelat Hitam (minimal 70% kakao) kaya akan magnesium dan antioksidan yang merangsang pelepasan endorfin. Kedua, Pisang yang sarat akan vitamin B6 dan kalium, sangat ampuh mengurangi kembung dan menstabilkan mood.", "Jangan lupa juga untuk mengonsumsi ikan berlemak seperti salmon yang kaya Omega-3, serta kacang almond. Hindari makanan yang terlalu asin atau tinggi gula olahan karena justru akan membuat tubuh cepat lelah dan emosi semakin tidak stabil."] },
                { id: 3, category: "Olahraga", icon: Activity, time: "4 min baca", title: "Mitos Berkeringat: Bolehkah Olahraga Berat Saat Menstruasi?", desc: "Fakta dibalik mitos olahraga saat haid. Kapan tubuh bilang 'berhenti' dan kapan bilang 'lanjutkan'.", content: ["Banyak mitos beredar yang melarang wanita berolahraga saat sedang menstruasi. Faktanya, olahraga justru sangat dianjurkan! Berolahraga memicu produksi endorfin, yang merupakan obat penghilang rasa sakit alami dari dalam tubuh, sehingga dapat mengurangi kram punggung dan perut.", "Namun, intensitasnya perlu disesuaikan. Pada hari ke-1 dan ke-2 saat aliran darah sedang deras-derasnya, tubuh menggunakan banyak energi. Lakukan olahraga ringan seperti yoga, peregangan (stretching), atau jalan santai.", "Jika kamu merasa lemas, pusing, atau aliran darah bertambah drastis setelah berolahraga berat seperti HIIT atau angkat beban, itu adalah sinyal dari tubuh untuk 'berhenti' dan beristirahat. Dengarkan tubuhmu, karena tidak ada aturan baku yang sama untuk setiap wanita."] },
                { id: 4, category: "Edukasi", icon: Info, time: "6 min baca", title: "Mengenal Fase Folikuler: Waktu Terbaik Memulai Hal Baru", desc: "Manfaatkan lonjakan energi pasca menstruasi untuk produktivitas maksimalmu.", content: ["Fase folikuler dimulai setelah menstruasi selesai dan berlangsung hingga masa ovulasi tiba. Di fase ini, kelenjar pituitari di otak melepaskan hormon perangsang folikel (FSH) yang memberi sinyal pada ovarium untuk mematangkan sel telur.", "Seiring matangnya sel telur, kadar hormon estrogen dalam tubuh akan meningkat tajam. Efeknya? Kamu akan merasa energi kembali penuh, pikiran lebih jernih, kulit terlihat lebih *glowing*, dan mood menjadi sangat positif dan optimis.", "Inilah mengapa fase folikuler disebut sebagai 'Musim Semi' dalam siklus wanita. Manfaatkan waktu emas ini untuk memulai proyek baru, melakukan presentasi penting, merencanakan jadwal sebulan ke depan, atau mempelajari keterampilan baru (hobi). Otak dan tubuhmu sedang berada dalam performa puncak!"] },
                { id: 5, category: "Kesehatan", icon: Sparkles, time: "4 min baca", title: "Tanda-tanda Masa Subur (Ovulasi) yang Sering Tidak Disadari", desc: "Pelajari perubahan unik pada tubuhmu saat melepaskan sel telur.", content: ["Masa ovulasi adalah saat dimana ovarium melepaskan sel telur yang sudah matang. Selain menggunakan kalender, tubuh sebenarnya memberikan sinyal-sinyal alami yang seringkali tidak kita sadari.", "Tanda paling jelas adalah perubahan pada lendir serviks. Menjelang ovulasi, cairan akan menjadi lebih jernih, licin, dan melar mirip seperti putih telur mentah. Ini bertujuan untuk membantu sperma berenang lebih mudah.", "Selain itu, beberapa wanita mengalami peningkatan suhu tubuh basal (suhu tubuh saat bangun tidur pagi) sebesar 0.5 derajat. Tanda lainnya termasuk peningkatan indera penciuman, nyeri ringan di salah satu sisi perut bawah (disebut Mittelschmerz), dan peningkatan energi serta gairah secara alami."] },
                { id: 6, category: "Kesehatan", icon: MoonIcon, time: "5 min baca", title: "Pentingnya Menjaga Kualitas Tidur Menjelang Hari H", desc: "Kebiasaan tidur yang lebih nyaman ketika gejala PMS mengganggu.", content: ["Sebagian orang mengalami perubahan kualitas tidur menjelang menstruasi. Perubahan hormon, rasa tidak nyaman, kram, atau perubahan mood dapat membuat tidur terasa lebih sulit.", "Coba pertahankan jam tidur dan bangun yang konsisten, buat kamar lebih nyaman, kurangi kafein pada sore atau malam hari, dan lakukan aktivitas relaksasi yang terasa cocok untukmu.", "Jika gangguan tidur berat, berlangsung lama, atau mengganggu kegiatan sehari-hari, bicarakan dengan tenaga kesehatan untuk mencari penyebab dan penanganan yang sesuai."] },
                { id: 7, category: "Edukasi", icon: Droplets, time: "4 min baca", title: "Menjaga Kebersihan Saat Menstruasi", desc: "Kebiasaan sederhana agar tetap nyaman dan mengurangi iritasi.", content: ["Ganti pembalut, tampon, atau kosongkan menstrual cup sesuai petunjuk produk dan kebutuhan tubuhmu. Cuci tangan sebelum dan sesudah mengganti produk menstruasi.", "Bersihkan area luar genital dengan air bersih dan hindari produk berpewangi kuat atau douching karena dapat memicu iritasi pada sebagian orang. Gunakan pakaian dalam yang bersih dan nyaman.", "Jika muncul gatal berat, bau yang sangat berbeda, demam, nyeri panggul, atau cairan yang mengkhawatirkan, pertimbangkan pemeriksaan tenaga kesehatan."] },
                { id: 8, category: "Waspada", icon: Stethoscope, time: "5 min baca", title: "Kapan Perubahan Menstruasi Perlu Diperiksakan?", desc: "Kenali perubahan yang sebaiknya tidak hanya dicatat, tetapi juga dikonsultasikan.", content: ["Pola menstruasi tiap orang berbeda, tetapi perubahan yang baru, menetap, atau mengganggu aktivitas layak diperhatikan. Catatan tanggal, lama perdarahan, gejala, dan tingkat nyeri dapat membantu saat berkonsultasi.", "Pertimbangkan berkonsultasi bila perdarahan berlangsung lebih dari sekitar 7 hari, harus mengganti produk menstruasi sangat sering, terdapat perdarahan di antara menstruasi atau setelah hubungan seksual, atau nyeri menjadi berat dan menghambat kegiatan harian.", "Cari pertolongan segera bila perdarahan sangat banyak disertai pusing berat, pingsan, sesak, nyeri hebat yang tidak biasa, atau ada kemungkinan kehamilan dengan perdarahan dan nyeri perut. SiklusKu bukan alat diagnosis."] }

                            </div>

                        {cycleInfo.phase === "Menstruasi" && <Droplet size={80} className="text-red-500 fill-red-500 drop-shadow-md" />}

                        <div className="p-5 bg-white dark:bg-slate-800 rounded-3xl border border-pink-100 dark:border-slate-700"><div className="text-3xl mb-3">🗓️</div><h4 className="font-bold">Bawa riwayat tanggal</h4><p className="text-sm text-slate-500 mt-2">Catat hari pertama, lama perdarahan, serta jarak antar siklus.</p></div>
                        <div className="p-5 bg-white dark:bg-slate-800 rounded-3xl border border-pink-100 dark:border-slate-700"><div className="text-3xl mb-3">🩸</div><h4 className="font-bold">Catat perubahan perdarahan</h4><p className="text-sm text-slate-500 mt-2">Frekuensi mengganti produk menstruasi dan adanya perdarahan di luar jadwal bisa membantu evaluasi.</p></div>
                        <div className="p-5 bg-white dark:bg-slate-800 rounded-3xl border border-pink-100 dark:border-slate-700"><div className="text-3xl mb-3">📊</div><h4 className="font-bold">Tunjukkan gejala & nyeri</h4><p className="text-sm text-slate-500 mt-2">Catatan gejala dan skala nyeri dari SiklusKu dapat menjadi ringkasan untuk konsultasi.</p></div>
                    </div>
                    <div className="text-xs text-slate-400 px-2">Referensi edukasi dalam rancangan fitur: NHS – Heavy periods, Period pain, Irregular periods, dan Vaginal bleeding between periods or after sex. Informasi dapat berubah dan tidak menggantikan evaluasi klinis.</div>
                </div>
                );
            };

            const StatistikView = () => {
                const sortedPeriods = [...periodLogs].filter(item => item.startDate).sort((a,b) => a.startDate.localeCompare(b.startDate));
                const cycleHistory = sortedPeriods.slice(1).map((item, idx) => {
                    const previous = new Date(sortedPeriods[idx].startDate + 'T00:00:00');
                    const current = new Date(item.startDate + 'T00:00:00');
                    const days = Math.round((current - previous) / 86400000);
                    return { startDate: item.startDate, length: days };
                }).filter(item => item.length > 0 && item.length < 120);
                const visibleCycles = cycleHistory.slice(-6);
                const avgCycle = visibleCycles.length ? Math.round(visibleCycles.reduce((sum,item)=>sum+item.length,0) / visibleCycles.length) : cycleLength;
                const minCycle = visibleCycles.length ? Math.min(...visibleCycles.map(item=>item.length)) : null;
                const maxCycle = visibleCycles.length ? Math.max(...visibleCycles.map(item=>item.length)) : null;
                const variability = minCycle !== null ? maxCycle - minCycle : null;
                const chartMax = Math.max(40, ...visibleCycles.map(item => item.length));

                return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                    <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 px-2">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2"><TrendingUp size={28} className="text-pink-500" /> Grafik & Riwayat Siklus</h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Grafik dihitung dari tanggal awal menstruasi yang benar-benar kamu simpan.</p>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input type="date" max={todayString} value={periodStartInput} onChange={(e)=>setPeriodStartInput(e.target.value)} className="bg-white dark:bg-slate-800 border border-pink-100 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-pink-300"/>
                            <button onClick={() => savePeriodStart(periodStartInput)} disabled={periodLogBusy} className="bg-pink-500 text-white font-bold px-4 py-3 rounded-2xl flex items-center justify-center gap-2 disabled:opacity-60"><Plus size={18}/>{periodLogBusy ? 'Menyimpan...' : 'Tambah Awal Haid'}</button>
                        </div>
                    </div>

                    {dailyLogMessage && <div className="p-4 rounded-2xl bg-green-50 dark:bg-green-900/20 border border-green-100 dark:border-green-900/30 text-green-700 dark:text-green-300 text-sm">{dailyLogMessage}</div>}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-gradient-to-br from-pink-400 to-rose-400 rounded-3xl p-6 text-white shadow-md">
                            <p className="text-pink-100 font-medium text-sm mb-1">Rata-rata Siklus Tercatat</p>
                            <div className="flex items-end gap-2"><span className="text-4xl font-black">{avgCycle}</span><span className="text-pink-100 mb-1">Hari</span></div>
                            <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">{visibleCycles.length ? `${visibleCycles.length} siklus terbaru` : 'Menunggu ≥ 2 tanggal awal haid'}</p>
                        </div>
                        <div className="bg-gradient-to-br from-fuchsia-400 to-purple-500 rounded-3xl p-6 text-white shadow-md">
                            <p className="text-fuchsia-100 font-medium text-sm mb-1">Lama Menstruasi Acuan</p>
                            <div className="flex items-end gap-2"><span className="text-4xl font-black">{periodLength}</span><span className="text-fuchsia-100 mb-1">Hari</span></div>
                            <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">Bisa diubah dari pengaturan</p>
                        </div>
                        <div className="bg-gradient-to-br from-blue-400 to-cyan-400 rounded-3xl p-6 text-white shadow-md">
                            <p className="text-blue-100 font-medium text-sm mb-1">Variasi 6 Siklus</p>
                            <div className="flex items-end gap-2"><span className="text-4xl font-black">{variability ?? '—'}</span>{variability !== null && <span className="text-blue-100 mb-1">Hari</span>}</div>
                            <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">{variability === null ? 'Belum cukup data' : `Terpendek ${minCycle} · terpanjang ${maxCycle}`}</p>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-pink-100 dark:border-slate-700">
                        <div className="flex justify-between gap-4 items-center mb-6">
                            <div><h3 className="font-bold text-slate-800 dark:text-white">Panjang Siklus Terbaru</h3><p className="text-xs text-slate-400 mt-1">Jarak hari dari awal haid ke awal haid berikutnya.</p></div>
                            <span className="text-xs font-bold text-pink-500 bg-pink-50 dark:bg-pink-900/20 px-3 py-1.5 rounded-full">Data asli</span>
                        </div>
                        {visibleCycles.length ? <div className="h-56 flex items-end justify-between gap-2 md:gap-4 mt-5 px-2 sm:px-4">
                            {visibleCycles.map((item, idx) => {
                                const heightPct = Math.max(8, Math.min((item.length / chartMax) * 100, 100));
                                const labelDate = new Date(item.startDate + 'T00:00:00').toLocaleDateString('id-ID', { month:'short', year:'2-digit' });
                                return <div key={item.startDate} className="flex flex-col items-center flex-1 group h-full justify-end">
                                    <div className="text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">{item.length} hr</div>
                                    <div className="w-full max-w-[54px] rounded-t-xl bg-gradient-to-t from-pink-500 to-purple-400 shadow-sm transition-all group-hover:scale-x-105" style={{height:`${heightPct}%`}}></div>
                                    <div className="text-[10px] sm:text-xs text-slate-400 mt-3 font-medium whitespace-nowrap">{labelDate}</div>
                                </div>
                            })}
                        </div> : <div className="py-14 text-center">
                            <div className="w-16 h-16 mx-auto rounded-full bg-pink-50 dark:bg-slate-700 flex items-center justify-center text-pink-500 mb-4"><TrendingUp size={28}/></div>
                            <h4 className="font-bold">Grafik akan muncul setelah ada minimal 2 tanggal awal haid</h4>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-2 max-w-md mx-auto">Tambah riwayat menstruasi sebelumnya dengan kolom tanggal di atas, atau gunakan tombol “Catat Haid Mulai Hari Ini” pada Catatan Harian saat menstruasi berikutnya dimulai.</p>
                        </div>}
                    </div>

                    <div className="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-pink-100 dark:border-slate-700">
                        <h3 className="font-bold mb-4">Riwayat awal menstruasi</h3>
                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                            {[...sortedPeriods].reverse().map((item, idx) => <div key={item.id || item.startDate} className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-700/50 rounded-2xl"><div className="flex items-center gap-3"><div className="w-9 h-9 rounded-xl bg-red-100 dark:bg-red-900/30 text-red-500 flex items-center justify-center"><Droplet size={18} className="fill-red-500"/></div><div><div className="font-bold text-sm">{new Date(item.startDate + 'T00:00:00').toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })}</div><div className="text-[11px] text-slate-400">Hari pertama menstruasi</div></div></div>{idx === 0 && <span className="text-[10px] font-bold text-pink-500 bg-pink-50 dark:bg-pink-900/20 px-2 py-1 rounded-full">TERBARU</span>}</div>)}
                            {!sortedPeriods.length && <p className="text-sm text-slate-400 text-center py-8">Belum ada riwayat.</p>}
                        </div>
                    </div>
                    <div className="text-xs text-slate-400 px-2">Grafik dan prediksi membantu melihat pola, bukan menentukan diagnosis atau memastikan tanggal menstruasi/ovulasi.</div>
                </div>
                );
            };

            const ArtikelView = () => {
                if (selectedArticle) {
                return (
                    <div className="animate-in slide-in-from-right-8 duration-300 bg-white dark:bg-slate-800 rounded-[2.5rem] p-6 md:p-10 shadow-sm border border-pink-100 dark:border-slate-700">
                    <button onClick={() => setSelectedArticle(null)} className="flex items-center gap-2 text-slate-500 hover:text-pink-500 font-medium mb-8 transition-colors bg-slate-50 dark:bg-slate-700/50 px-4 py-2 rounded-xl"><ArrowLeft size={20} /> Kembali ke Daftar</button>
                    <div className="flex items-center gap-3 mb-6">
                        <div className="bg-pink-100 dark:bg-slate-700 p-3 rounded-2xl text-pink-500"><selectedArticle.icon size={32} /></div>
                        <div>
                        <span className="text-xs font-bold text-purple-500 dark:text-purple-400 uppercase tracking-wider">{selectedArticle.category}</span>
                        <span className="text-xs text-slate-400 ml-3 flex items-center gap-1 inline-flex"><Clock size={12}/> {selectedArticle.time}</span>
                        </div>
                    </div>
                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 dark:text-white mb-8 leading-tight">{selectedArticle.title}</h2>
                    <div className="space-y-6 text-slate-600 dark:text-slate-300 text-lg leading-relaxed">
                        {selectedArticle.content.map((paragraph, idx) => (<p key={idx}>{paragraph}</p>))}
                    </div>
                    </div>
                );
                }

                return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                    <div className="flex items-center justify-between px-2">
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2"><BookOpen size={28} className="text-pink-500" /> Artikel Edukasi</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {articles.map((art) => (
                        <div key={art.id} onClick={() => setSelectedArticle(art)} className="group bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-pink-100 dark:border-slate-700 hover:shadow-md hover:border-pink-300 dark:hover:border-pink-500 hover:-translate-y-1 transition-all cursor-pointer flex flex-col h-full">
                        <div className="flex items-start gap-4 flex-1">
                            <div className="bg-pink-50 dark:bg-slate-700 p-4 rounded-2xl group-hover:bg-pink-500 group-hover:text-white transition-colors text-pink-500"><art.icon size={28} /></div>
                            <div className="flex-1">
                                <div className="flex justify-between items-center mb-2">
                                <span className="text-xs font-bold text-purple-500 dark:text-purple-400 uppercase tracking-wider">{art.category}</span>
                                <span className="text-xs text-slate-400 flex items-center gap-1"><Clock size={12}/> {art.time}</span>
                                </div>
                                <h3 className="font-bold text-lg text-slate-800 dark:text-white leading-tight mb-2 group-hover:text-pink-500 transition-colors">{art.title}</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-400 line-clamp-2">{art.desc}</p>
                            </div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-50 dark:border-slate-700 flex justify-end">
                            <span className="text-sm font-semibold text-pink-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">Baca Selengkapnya <ChevronRight size={16}/></span>
                        </div>
                        </div>
                    ))}
                    </div>
                </div>
                );
            };
            return (
                <div className="min-h-screen bg-pink-50/50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-300 flex overflow-hidden">
                {isSidebarOpen && (<div className="fixed inset-0 bg-pink-900/20 dark:bg-black/50 backdrop-blur-sm z-40 lg:hidden" onClick={() => setIsSidebarOpen(false)} />)}
                
                <aside className={`fixed lg:static inset-y-0 left-0 w-64 bg-white dark:bg-slate-800 shadow-xl lg:shadow-none lg:border-r border-pink-100 dark:border-slate-700 z-50 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col overflow-y-auto`}>
                    <div className="p-6 flex items-center justify-between">
                    <div className="flex items-center gap-2 text-pink-500 dark:text-pink-400"><CalendarHeart size={28} className="animate-pulse" /><h1 className="text-2xl font-black tracking-tight">Siklus<span className="text-pink-300">Ku</span></h1></div>
                    <button className="lg:hidden text-slate-400 hover:text-pink-500" onClick={() => setIsSidebarOpen(false)}><X size={24} /></button>
                    </div>

                    <div className="px-6 py-4 space-y-6 flex-1">
                    <div className="space-y-4">
                        <h2 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Pengaturan Siklus</h2>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300">Awal Haid Terakhir</label>
                        <input type="date" max={todayString} value={lastPeriodDate} onChange={(e) => setLastPeriodDate(e.target.value)} className="w-full bg-pink-50 dark:bg-slate-700 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-pink-400 outline-none text-slate-700 dark:text-slate-200 cursor-pointer" />
                        </div>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex justify-between"><span>Siklus</span><span className="text-pink-500 font-bold">{cycleLength} Hari</span></label>
                        <input type="range" min="21" max="35" value={cycleLength} onChange={(e) => setCycleLength(parseInt(e.target.value))} className="w-full accent-pink-500" />
                        </div>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex justify-between"><span>Lama Haid</span><span className="text-pink-500 font-bold">{periodLength} Hari</span></label>
                        <input type="range" min="3" max="10" value={periodLength} onChange={(e) => setPeriodLength(parseInt(e.target.value))} className="w-full accent-pink-500" />
                        </div>
                    </div>
                    <hr className="border-pink-100 dark:border-slate-700" />
                    <nav className="space-y-2">
                        {[
                        { id: 'beranda', icon: Activity, label: "Beranda" },
                        { id: 'catatan', icon: ClipboardList, label: "Catatan Gejala & Nyeri" },
                        { id: 'kalender', icon: Calendar, label: "Kalender" },
                        { id: 'statistik', icon: TrendingUp, label: "Grafik Siklus" },
                        { id: 'artikel', icon: BookOpen, label: "Artikel Edukasi" },
                        { id: 'kesehatan', icon: Stethoscope, label: "Kapan Konsultasi" },
                        { id: 'pengingat', icon: Bell, label: "Pengingat" },
                        ].map((item) => (
                        <button key={item.id} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); if(item.id !== 'artikel') setSelectedArticle(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl transition-all ${activeTab === item.id ? 'bg-pink-500 text-white shadow-md shadow-pink-200 dark:shadow-none' : 'text-slate-600 dark:text-slate-400 hover:bg-pink-50 dark:hover:bg-slate-700 hover:text-pink-500'}`}>
                            <item.icon size={20} /> <span className="font-medium">{item.label}</span>
                        </button>
                        ))}
                    </nav>
                    </div>

<a href="https://instagram.com/xdaniel04" target="_blank" rel="noopener noreferrer" className="menu-item instagram-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="menu-icon">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>

</a>


                    <div className="p-6 mt-auto">
                    <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-red-500 bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 py-3 rounded-2xl font-bold transition-colors">
                        <LogOut size={18} /> Keluar dari Akun
                    </button>
                    </div>
                </aside>

                <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                    <header className="h-20 flex items-center justify-between px-6 lg:px-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-pink-100/50 dark:border-slate-800">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-slate-600 dark:text-slate-300 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl"><Menu size={24} /></button>
                        <h1 className="text-xl font-black text-slate-800 dark:text-white capitalize hidden sm:block">{({beranda:'Dashboard',catatan:'Catatan Harian',kalender:'Kalender Siklus',statistik:'Grafik Siklus',artikel:'Artikel Edukasi',kesehatan:'Kapan Konsultasi',pengingat:'Pengingat'})[activeTab] || activeTab}</h1>
                    </div>
                    <div className="flex items-center gap-4">
                        <div className={`hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold ${syncState === 'error' ? 'bg-red-50 dark:bg-red-900/20 text-red-500' : syncState === 'syncing' ? 'bg-amber-50 dark:bg-amber-900/20 text-amber-500' : 'bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400'}`} title="Status sinkronisasi Firebase">
                            <span className={`w-2 h-2 rounded-full ${syncState === 'error' ? 'bg-red-500' : syncState === 'syncing' ? 'bg-amber-400 animate-pulse' : 'bg-green-500'}`}></span>
                            {syncState === 'error' ? 'Gagal Sinkron' : syncState === 'syncing' ? 'Menyimpan...' : 'Tersimpan'}
                        </div>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 bg-pink-50 dark:bg-slate-800 text-pink-500 dark:text-amber-300 rounded-full hover:scale-110 transition-transform shadow-sm">
                        {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                        </button>
                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-400 to-purple-400 border-2 border-white dark:border-slate-700 shadow-md flex items-center justify-center text-white font-bold text-sm cursor-pointer hover:ring-2 hover:ring-pink-300 transition-all uppercase" title={`${userName} (${userAge} th)`}>
                        {userName ? userName.substring(0, 2) : "US"}
                        </div>
                    </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10 pb-24 scroll-smooth">
                    <div className="max-w-5xl mx-auto">
                        {activeTab === 'beranda' && <BerandaView />}
                        {activeTab === 'catatan' && <CatatanView />}
                        {activeTab === 'kalender' && <KalenderView />}
                        {activeTab === 'statistik' && <StatistikView />}
                        {activeTab === 'artikel' && <ArtikelView />}
                        {activeTab === 'kesehatan' && <HealthInfoView />}
                        {activeTab === 'pengingat' && <ReminderView />}
                    </div>
                    </div>
                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
