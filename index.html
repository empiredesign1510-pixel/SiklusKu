         // ==========================================
        // 2. APLIKASI UTAMA (REACT COMPONENT)

        const App = () => {
            const [userName, setUserName] = useState(() => localStorage.getItem('siklusku_name') || '');
            const [userAge, setUserAge] = useState(() => localStorage.getItem('siklusku_age') || '');

            const [lastPeriodDate, setLastPeriodDate] = useState(() => {
                const saved = localStorage.getItem('siklusku_lastPeriod');
                if (saved) return saved;
                const d = new Date();
                d.setDate(d.getDate() - 2); 
                return d.toISOString().split('T')[0];
            });
            const [cycleLength, setCycleLength] = useState(() => parseInt(localStorage.getItem('siklusku_cycle')) || 28);
            const [periodLength, setPeriodLength] = useState(() => parseInt(localStorage.getItem('siklusku_period')) || 5);
            
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('siklusku_theme') === 'dark');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('beranda');
            
            const [waterGlasses, setWaterGlasses] = useState(0);
            const [currentMood, setCurrentMood] = useState(null);
            
            const [cheeringMessage, setCheeringMessage] = useState("");
            const [messageKey, setMessageKey] = useState(0);
            
            const [currentMonth, setCurrentMonth] = useState(new Date().getMonth());
            const [currentYear, setCurrentYear] = useState(new Date().getFullYear());
            const [selectedArticle, setSelectedArticle] = useState(null);

            const [tempName, setTempName] = useState('');
            const [tempAge, setTempAge] = useState('');

            useEffect(() => {
                if (userName) localStorage.setItem('siklusku_name', userName);
                if (userAge) localStorage.setItem('siklusku_age', userAge);
                localStorage.setItem('siklusku_lastPeriod', lastPeriodDate);
                localStorage.setItem('siklusku_cycle', cycleLength);
                localStorage.setItem('siklusku_period', periodLength);
            }, [userName, userAge, lastPeriodDate, cycleLength, periodLength]);

            useEffect(() => {
                if (isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('siklusku_theme', 'dark');
                } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('siklusku_theme', 'light');
                }
            }, [isDarkMode]);

            const handleStartApp = (e) => {
                e.preventDefault();
                if (tempName.trim() !== '' && tempAge !== '') {
                setUserName(tempName);
                setUserAge(tempAge);
                setShowOnboarding(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('siklusku_name');
                localStorage.removeItem('siklusku_age');
                setUserName(''); setUserAge(''); setTempName(''); setTempAge('');
                setShowOnboarding(true); setIsSidebarOpen(false);
            };
            const moodQuotes = {
                0: ["Peluk jauh! 🫂 Ingat, kamu kuat dan rasa ini bakal berlalu kok.", "Nggak apa-apa sedih, wajar kok! Makan cokelat gih sana, aku izinkan! 🍫", "Air mata itu ibarat keringatnya hati yang lagi olahraga. Nangis aja kalau perlu! 💦", "Ugh, rahim emang kadang ngeselin! Ayo rebahan aja, kamu berhak istirahat! 🛏️", "Dunia mungkin terasa berat hari ini, tapi pundakmu lebih kuat dari yang kamu kira! 💪"],

            };

            const handleMoodClick = (idx) => {
                setCurrentMood(idx);
                const quotes = moodQuotes[idx];
                let randomIndex = Math.floor(Math.random() * quotes.length);
                while (quotes[randomIndex] === cheeringMessage && quotes.length > 1) {
                randomIndex = Math.floor(Math.random() * quotes.length);
                }
                setCheeringMessage(quotes[randomIndex]);
                setMessageKey(prevKey => prevKey + 1);
            };

            const getPhaseForDate = (checkDate, baseDate, cycleL, periodL) => {
                const cDate = new Date(checkDate); cDate.setHours(0,0,0,0);
                const bDate = new Date(baseDate); bDate.setHours(0,0,0,0);
                const diffTime = cDate - bDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let dayOfCycle;
                if (diffDays >= 0) { dayOfCycle = (diffDays % cycleL) + 1; } 
                else { dayOfCycle = cycleL - (Math.abs(diffDays + 1) % cycleL); if (dayOfCycle === 0) dayOfCycle = cycleL; }

                if (dayOfCycle <= periodL) return { phase: "Menstruasi", color: "bg-red-500", text: "text-red-600 dark:text-red-400", bgLight: "bg-red-100 dark:bg-red-900/30" };
                if (dayOfCycle > cycleL - 16 && dayOfCycle <= cycleL - 12) return { phase: "Ovulasi", color: "bg-yellow-400", text: "text-amber-600 dark:text-yellow-400", bgLight: "bg-yellow-100 dark:bg-yellow-900/30" };
                if (dayOfCycle > periodL && dayOfCycle <= cycleL - 16) return { phase: "Paska Menstruasi", color: "bg-pink-400", text: "text-pink-600 dark:text-pink-400", bgLight: "bg-pink-50 dark:bg-pink-900/20" };

            };

            const cycleInfo = useMemo(() => {
                const today = new Date();
                const info = getPhaseForDate(today, lastPeriodDate, cycleLength, periodLength);
                const bDate = new Date(lastPeriodDate); bDate.setHours(0,0,0,0);
                const diffTime = today.setHours(0,0,0,0) - bDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const currentDayOfCycle = diffDays >= 0 ? (diffDays % cycleLength) + 1 : cycleLength - (Math.abs(diffDays + 1) % cycleLength);
                const daysUntilNextPeriod = cycleLength - currentDayOfCycle + 1;
                const nextPeriodDate = new Date(today); nextPeriodDate.setDate(today.getDate() + daysUntilNextPeriod);
                return { currentDayOfCycle, phase: info.phase, phaseColor: info.color, daysUntilNextPeriod, nextPeriodDate };
            }, [lastPeriodDate, cycleLength, periodLength]);

            const currentTips = {

                "Pra Menstruasi": { quote: "Hari H makin dekat, wajar jika mood sedikit berantakan. Be gentle to yourself! ☁️", waterTarget: 8, dos: ["Pisang (Kaya magnesium)", "Ubi jalar", "Biji labu", "Mandi air hangat"], donts: ["Garam berlebih", "Kafein (memicu cemas)", "Gula berlebih"], exercise: ["Pilates santai", "Peregangan otot pinggang", "Latihan pernapasan"], activity: ["Meditasi atau mindfulness", "Kurangi interaksi pemicu stres", "Skincare routine panjang"] }
            }[cycleInfo.phase];
            
            const articles = [
                { id: 1, category: "Kesehatan", icon: AlertCircle, time: "3 min baca", title: "Mengapa Perut Terasa Kram Saat Hari Pertama Haid?", desc: "Penjelasan medis mengenai kontraksi rahim dan cara alami meredakannya tanpa obat keras.", content: ["Kram perut atau dismenore pada hari pertama menstruasi adalah hal yang sangat umum dialami oleh banyak wanita. Rasa sakit ini disebabkan oleh hormon bernama prostaglandin yang memicu otot rahim berkontraksi untuk meluruhkan lapisannya.", "Semakin tinggi kadar prostaglandin, semakin kuat kontraksi yang terjadi. Kontraksi yang terlalu kuat ini bisa menekan pembuluh darah di sekitarnya, memutus suplai oksigen ke jaringan rahim sesaat, yang akhirnya mengirimkan sinyal rasa sakit ke otak.", "Untuk meredakannya secara alami, kamu bisa mencoba mengompres perut dengan botol air hangat. Panas membantu melemaskan otot rahim yang tegang. Selain itu, meminum teh jahe atau teh chamomile hangat terbukti secara klinis dapat menurunkan kadar prostaglandin dan memberikan efek rileks pada tubuh."] },
                { id: 2, category: "Nutrisi", icon: Apple, time: "5 min baca", title: "7 Makanan Ajaib Penyelamat Mood Swing PMS", desc: "Dari cokelat hitam hingga pisang, temukan makanan yang terbukti memperbaiki mood saat PMS.", content: ["Pre-Menstrual Syndrome (PMS) seringkali membawa gelombang emosi yang naik turun alias mood swing. Hal ini disebabkan oleh fluktuasi hormon estrogen dan progesteron yang mempengaruhi zat kimia otak seperti serotonin (hormon kebahagiaan).", "Kabar baiknya, asupan makanan yang tepat bisa menjadi penyelamat! Pertama, Cokelat Hitam (minimal 70% kakao) kaya akan magnesium dan antioksidan yang merangsang pelepasan endorfin. Kedua, Pisang yang sarat akan vitamin B6 dan kalium, sangat ampuh mengurangi kembung dan menstabilkan mood.", "Jangan lupa juga untuk mengonsumsi ikan berlemak seperti salmon yang kaya Omega-3, serta kacang almond. Hindari makanan yang terlalu asin atau tinggi gula olahan karena justru akan membuat tubuh cepat lelah dan emosi semakin tidak stabil."] },
                { id: 3, category: "Olahraga", icon: Activity, time: "4 min baca", title: "Mitos Berkeringat: Bolehkah Olahraga Berat Saat Menstruasi?", desc: "Fakta dibalik mitos olahraga saat haid. Kapan tubuh bilang 'berhenti' dan kapan bilang 'lanjutkan'.", content: ["Banyak mitos beredar yang melarang wanita berolahraga saat sedang menstruasi. Faktanya, olahraga justru sangat dianjurkan! Berolahraga memicu produksi endorfin, yang merupakan obat penghilang rasa sakit alami dari dalam tubuh, sehingga dapat mengurangi kram punggung dan perut.", "Namun, intensitasnya perlu disesuaikan. Pada hari ke-1 dan ke-2 saat aliran darah sedang deras-derasnya, tubuh menggunakan banyak energi. Lakukan olahraga ringan seperti yoga, peregangan (stretching), atau jalan santai.", "Jika kamu merasa lemas, pusing, atau aliran darah bertambah drastis setelah berolahraga berat seperti HIIT atau angkat beban, itu adalah sinyal dari tubuh untuk 'berhenti' dan beristirahat. Dengarkan tubuhmu, karena tidak ada aturan baku yang sama untuk setiap wanita."] },
                { id: 4, category: "Edukasi", icon: Info, time: "6 min baca", title: "Mengenal Fase Folikuler: Waktu Terbaik Memulai Hal Baru", desc: "Manfaatkan lonjakan energi pasca menstruasi untuk produktivitas maksimalmu.", content: ["Fase folikuler dimulai setelah menstruasi selesai dan berlangsung hingga masa ovulasi tiba. Di fase ini, kelenjar pituitari di otak melepaskan hormon perangsang folikel (FSH) yang memberi sinyal pada ovarium untuk mematangkan sel telur.", "Seiring matangnya sel telur, kadar hormon estrogen dalam tubuh akan meningkat tajam. Efeknya? Kamu akan merasa energi kembali penuh, pikiran lebih jernih, kulit terlihat lebih *glowing*, dan mood menjadi sangat positif dan optimis.", "Inilah mengapa fase folikuler disebut sebagai 'Musim Semi' dalam siklus wanita. Manfaatkan waktu emas ini untuk memulai proyek baru, melakukan presentasi penting, merencanakan jadwal sebulan ke depan, atau mempelajari keterampilan baru (hobi). Otak dan tubuhmu sedang berada dalam performa puncak!"] },
                { id: 5, category: "Kesehatan", icon: Sparkles, time: "4 min baca", title: "Tanda-tanda Masa Subur (Ovulasi) yang Sering Tidak Disadari", desc: "Pelajari perubahan unik pada tubuhmu saat melepaskan sel telur.", content: ["Masa ovulasi adalah saat dimana ovarium melepaskan sel telur yang sudah matang. Selain menggunakan kalender, tubuh sebenarnya memberikan sinyal-sinyal alami yang seringkali tidak kita sadari.", "Tanda paling jelas adalah perubahan pada lendir serviks. Menjelang ovulasi, cairan akan menjadi lebih jernih, licin, dan melar mirip seperti putih telur mentah. Ini bertujuan untuk membantu sperma berenang lebih mudah.", "Selain itu, beberapa wanita mengalami peningkatan suhu tubuh basal (suhu tubuh saat bangun tidur pagi) sebesar 0.5 derajat. Tanda lainnya termasuk peningkatan indera penciuman, nyeri ringan di salah satu sisi perut bawah (disebut Mittelschmerz), dan peningkatan energi serta gairah secara alami."] },

                            <div className="absolute bottom-1.5 md:bottom-2 flex gap-1">
                            {phaseData.phase === "Menstruasi" && <Droplet size={14} className="text-red-500 fill-red-500" />}
                            {phaseData.phase === "Ovulasi" && <EggIcon size={14} className="text-yellow-500 fill-yellow-400" />}
                            {phaseData.phase === "Pra Menstruasi" && <div className="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-purple-500 opacity-70"></div>}
                            </div>
                        </div>
                        );
                    })}
                    </div>
                </div>
                );
            };

            const StatistikView = () => {
                const pastCycles = [28, 29, 27, 30, 28, cycleLength];
                const avgCycle = Math.round(pastCycles.reduce((a,b)=>a+b,0) / pastCycles.length);

                return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2 px-2"><TrendingUp size={28} className="text-pink-500" /> Statistik Kesehatan</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-gradient-to-br from-pink-400 to-rose-400 rounded-3xl p-6 text-white shadow-md">
                        <p className="text-pink-100 font-medium text-sm mb-1">Rata-rata Siklus</p>
                        <div className="flex items-end gap-2"><span className="text-4xl font-black">{avgCycle}</span><span className="text-pink-100 mb-1">Hari</span></div>
                        <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">Normal & Teratur</p>
                    </div>
                    <div className="bg-gradient-to-br from-fuchsia-400 to-purple-500 rounded-3xl p-6 text-white shadow-md">
                        <p className="text-fuchsia-100 font-medium text-sm mb-1">Rata-rata Haid</p>
                        <div className="flex items-end gap-2"><span className="text-4xl font-black">{periodLength}</span><span className="text-fuchsia-100 mb-1">Hari</span></div>
                        <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">Sehat</p>
                    </div>
                    <div className="bg-gradient-to-br from-blue-400 to-cyan-400 rounded-3xl p-6 text-white shadow-md">
                        <p className="text-blue-100 font-medium text-sm mb-1">Skor Hidrasi Bulan Ini</p>
                        <div className="flex items-end gap-2"><span className="text-4xl font-black">85</span><span className="text-blue-100 mb-1">%</span></div>
                        <p className="text-xs mt-4 bg-white/20 inline-block px-3 py-1 rounded-full backdrop-blur-sm">Sangat Baik 💧</p>
                    </div>
                    </div>
                    <div className="bg-white dark:bg-slate-800 p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-pink-100 dark:border-slate-700">
                    <h3 className="font-bold text-slate-800 dark:text-white mb-6">Riwayat Panjang Siklus (6 Bulan)</h3>
                    <div className="h-48 flex items-end justify-between gap-2 md:gap-4 mt-8 px-4">
                        {pastCycles.map((val, idx) => {
                        const heightPct = Math.min((val / 35) * 100, 100);
                        const isCurrent = idx === pastCycles.length - 1;
                        return (
                            <div key={idx} className="flex flex-col items-center flex-1 group">
                            <div className="opacity-0 group-hover:opacity-100 transition-opacity text-xs font-bold text-slate-600 dark:text-slate-300 mb-2">{val} hr</div>
                            <div className={`w-full max-w-[40px] rounded-t-xl transition-all duration-700 ${isCurrent ? 'bg-pink-500 shadow-md' : 'bg-pink-200 dark:bg-slate-600 group-hover:bg-pink-300 dark:group-hover:bg-slate-500'}`} style={{ height: `${heightPct}%` }}></div>
                            <div className="text-xs text-slate-400 mt-3 font-medium">Bln {idx+1}</div>
                            </div>
                        )
                        })}
                    </div>
                    </div>
                </div>
                );
            };

            const ArtikelView = () => {
                if (selectedArticle) {
                return (
                    <div className="animate-in slide-in-from-right-8 duration-300 bg-white dark:bg-slate-800 rounded-[2.5rem] p-6 md:p-10 shadow-sm border border-pink-100 dark:border-slate-700">
                    <button onClick={() => setSelectedArticle(null)} className="flex items-center gap-2 text-slate-500 hover:text-pink-500 font-medium mb-8 transition-colors bg-slate-50 dark:bg-slate-700/50 px-4 py-2 rounded-xl"><ArrowLeft size={20} /> Kembali ke Daftar</button>
                    <div className="flex items-center gap-3 mb-6">
                        <div className="bg-pink-100 dark:bg-slate-700 p-3 rounded-2xl text-pink-500"><selectedArticle.icon size={32} /></div>
                        <div>
                        <span className="text-xs font-bold text-purple-500 dark:text-purple-400 uppercase tracking-wider">{selectedArticle.category}</span>
                        <span className="text-xs text-slate-400 ml-3 flex items-center gap-1 inline-flex"><Clock size={12}/> {selectedArticle.time}</span>
                        </div>
                    </div>
                    <h2 className="text-3xl md:text-4xl font-black text-slate-800 dark:text-white mb-8 leading-tight">{selectedArticle.title}</h2>
                    <div className="space-y-6 text-slate-600 dark:text-slate-300 text-lg leading-relaxed">
                        {selectedArticle.content.map((paragraph, idx) => (<p key={idx}>{paragraph}</p>))}
                    </div>
                    </div>
                );
                }

                return (
                <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                    <div className="flex items-center justify-between px-2">
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-2"><BookOpen size={28} className="text-pink-500" /> Artikel Edukasi</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {articles.map((art) => (
                        <div key={art.id} onClick={() => setSelectedArticle(art)} className="group bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-pink-100 dark:border-slate-700 hover:shadow-md hover:border-pink-300 dark:hover:border-pink-500 hover:-translate-y-1 transition-all cursor-pointer flex flex-col h-full">
                        <div className="flex items-start gap-4 flex-1">
                            <div className="bg-pink-50 dark:bg-slate-700 p-4 rounded-2xl group-hover:bg-pink-500 group-hover:text-white transition-colors text-pink-500"><art.icon size={28} /></div>
                            <div className="flex-1">
                                <div className="flex justify-between items-center mb-2">
                                <span className="text-xs font-bold text-purple-500 dark:text-purple-400 uppercase tracking-wider">{art.category}</span>
                                <span className="text-xs text-slate-400 flex items-center gap-1"><Clock size={12}/> {art.time}</span>
                                </div>
                                <h3 className="font-bold text-lg text-slate-800 dark:text-white leading-tight mb-2 group-hover:text-pink-500 transition-colors">{art.title}</h3>
                                <p className="text-sm text-slate-600 dark:text-slate-400 line-clamp-2">{art.desc}</p>
                            </div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-50 dark:border-slate-700 flex justify-end">
                            <span className="text-sm font-semibold text-pink-500 flex items-center gap-1 group-hover:translate-x-1 transition-transform">Baca Selengkapnya <ChevronRight size={16}/></span>
                        </div>
                        </div>
                    ))}
                    </div>
                </div>
                );
            };
            return (
                <div className="min-h-screen bg-pink-50/50 dark:bg-slate-900 font-sans text-slate-800 dark:text-slate-100 transition-colors duration-300 flex overflow-hidden">
                {isSidebarOpen && (<div className="fixed inset-0 bg-pink-900/20 dark:bg-black/50 backdrop-blur-sm z-40 lg:hidden" onClick={() => setIsSidebarOpen(false)} />)}
                
                <aside className={`fixed lg:static inset-y-0 left-0 w-64 bg-white dark:bg-slate-800 shadow-xl lg:shadow-none lg:border-r border-pink-100 dark:border-slate-700 z-50 transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col overflow-y-auto`}>
                    <div className="p-6 flex items-center justify-between">
                    <div className="flex items-center gap-2 text-pink-500 dark:text-pink-400"><CalendarHeart size={28} className="animate-pulse" /><h1 className="text-2xl font-black tracking-tight">Siklus<span className="text-pink-300">Ku</span></h1></div>
                    <button className="lg:hidden text-slate-400 hover:text-pink-500" onClick={() => setIsSidebarOpen(false)}><X size={24} /></button>
                    </div>

                    <div className="px-6 py-4 space-y-6 flex-1">
                    <div className="space-y-4">
                        <h2 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Pengaturan Siklus</h2>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300">Awal Haid Terakhir</label>
                        <input type="date" value={lastPeriodDate} onChange={(e) => setLastPeriodDate(e.target.value)} className="w-full bg-pink-50 dark:bg-slate-700 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-pink-400 outline-none text-slate-700 dark:text-slate-200 cursor-pointer" />
                        </div>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex justify-between"><span>Siklus</span><span className="text-pink-500 font-bold">{cycleLength} Hari</span></label>
                        <input type="range" min="21" max="35" value={cycleLength} onChange={(e) => setCycleLength(parseInt(e.target.value))} className="w-full accent-pink-500" />
                        </div>
                        <div className="space-y-2">
                        <label className="text-sm font-medium text-slate-600 dark:text-slate-300 flex justify-between"><span>Lama Haid</span><span className="text-pink-500 font-bold">{periodLength} Hari</span></label>
                        <input type="range" min="3" max="10" value={periodLength} onChange={(e) => setPeriodLength(parseInt(e.target.value))} className="w-full accent-pink-500" />
                        </div>
                    </div>
                    <hr className="border-pink-100 dark:border-slate-700" />
                    <nav className="space-y-2">
                        {[
                        { id: 'beranda', icon: Activity, label: "Beranda" },
                        { id: 'kalender', icon: Calendar, label: "Kalender" },
                        { id: 'statistik', icon: TrendingUp, label: "Statistik Kesehatan" },
                        { id: 'artikel', icon: BookOpen, label: "Artikel Edukasi" },
                        ].map((item) => (
                        <button key={item.id} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); if(item.id !== 'artikel') setSelectedArticle(null); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl transition-all ${activeTab === item.id ? 'bg-pink-500 text-white shadow-md shadow-pink-200 dark:shadow-none' : 'text-slate-600 dark:text-slate-400 hover:bg-pink-50 dark:hover:bg-slate-700 hover:text-pink-500'}`}>
                            <item.icon size={20} /> <span className="font-medium">{item.label}</span>
                        </button>
                        ))}
                    </nav>
                    </div>

<a href="https://instagram.com/xdaniel04" target="_blank" rel="noopener noreferrer" class="menu-item instagram-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
    </svg>
    <span>My Instagram</span>
</a>


                    <div className="p-6 mt-auto">
                    <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 text-red-500 bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/40 py-3 rounded-2xl font-bold transition-colors">
                        <LogOut size={18} /> Keluar & Ubah Profil
                    </button>
                    </div>
                </aside>

                <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                    <header className="h-20 flex items-center justify-between px-6 lg:px-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 border-b border-pink-100/50 dark:border-slate-800">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-slate-600 dark:text-slate-300 hover:bg-pink-50 dark:hover:bg-slate-800 rounded-xl"><Menu size={24} /></button>
                        <h1 className="text-xl font-black text-slate-800 dark:text-white capitalize hidden sm:block">{activeTab === 'beranda' ? 'Dashboard' : activeTab}</h1>
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 bg-pink-50 dark:bg-slate-800 text-pink-500 dark:text-amber-300 rounded-full hover:scale-110 transition-transform shadow-sm">
                        {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                        </button>
                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-400 to-purple-400 border-2 border-white dark:border-slate-700 shadow-md flex items-center justify-center text-white font-bold text-sm cursor-pointer hover:ring-2 hover:ring-pink-300 transition-all uppercase" title={`${userName} (${userAge} th)`}>
                        {userName ? userName.substring(0, 2) : "US"}
                        </div>
                    </div>
                    </header>

                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10 pb-24 scroll-smooth">
                    <div className="max-w-5xl mx-auto">
                        {activeTab === 'beranda' && <BerandaView />}
                        {activeTab === 'kalender' && <KalenderView />}
                        {activeTab === 'statistik' && <StatistikView />}
                        {activeTab === 'artikel' && <ArtikelView />}
                    </div>
                    </div>
                </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
